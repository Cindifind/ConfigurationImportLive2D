<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live2D 参数控制面板</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0f172a; font-family: system-ui, sans-serif; }

    /* 左侧 Live2D 模型 */
    #model-area {
      position: fixed;
      left: 0;
      top: 0;
      width: calc(100% - 420px);
      height: 100%;
      /*background: url('./background2.png') no-repeat center center;*/
      /*background-size: cover;*/
    }
    #live2d-wrapper { position: absolute; width: 100%; height: 100%; }

    /* 右侧控制面板 */
    #panel { position: fixed; right: 0; top: 0; width: 420px; height: 100%; background: #1e293b; border-left: 1px solid #334155; display: flex; flex-direction: column; }
    #panel-header { padding: 12px 16px; background: #0f172a; border-bottom: 1px solid #334155; flex-shrink: 0; }
    #panel-header h2 { color: #e2e8f0; font-size: 15px; margin: 0 0 8px 0; }
    #panel-header .info { color: #94a3b8; font-size: 12px; }
    #search { width: 100%; padding: 6px 10px; margin-top: 8px; border: 1px solid #334155; border-radius: 4px; background: #0f172a; color: #e2e8f0; font-size: 13px; outline: none; }
    #search:focus { border-color: #5b6aef; }
    #panel-body { flex: 1; overflow-y: auto; padding: 8px; }

    /* 参数行 */
    .param-group { margin-bottom: 2px; }
    .param-row { display: flex; align-items: center; padding: 6px 8px; border-radius: 4px; cursor: pointer; transition: background 0.1s; }
    .param-row:hover { background: #334155; }
    .param-name { flex: 0 0 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #cbd5e1; font-size: 12px; font-weight: 500; }
    .param-slider { flex: 1; margin: 0 8px; -webkit-appearance: none; height: 4px; background: #334155; border-radius: 2px; outline: none; }
    .param-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #5b6aef; cursor: pointer; }
    .param-value { flex: 0 0 50px; text-align: right; color: #94a3b8; font-size: 11px; font-family: monospace; }
    .param-range { flex: 0 0 80px; text-align: right; color: #64748b; font-size: 10px; font-family: monospace; }

    /* 展开详情 */
    .param-detail { display: none; padding: 4px 8px 8px 128px; background: #1e293b; }
    .param-detail.show { display: block; }
    .param-detail .detail-row { display: flex; gap: 12px; margin-bottom: 2px; color: #64748b; font-size: 11px; }
    .param-detail .detail-row span { color: #94a3b8; }
    .param-detail .reset-btn { margin-top: 4px; padding: 2px 8px; border: 1px solid #334155; border-radius: 3px; background: transparent; color: #94a3b8; font-size: 11px; cursor: pointer; }
    .param-detail .reset-btn:hover { background: #334155; color: #e2e8f0; }

    /* 底部统计 */
    #panel-footer { padding: 8px 16px; background: #0f172a; border-top: 1px solid #334155; flex-shrink: 0; }
    #panel-footer .stats { color: #64748b; font-size: 11px; }
    #panel-footer button { margin-left: 8px; padding: 3px 10px; border: 1px solid #334155; border-radius: 3px; background: transparent; color: #94a3b8; font-size: 11px; cursor: pointer; }
    #panel-footer button:hover { background: #334155; color: #e2e8f0; }

    /* 加载中 */
    #loading { position: fixed; left: 0; top: 0; width: calc(100% - 420px); height: 100%; display: flex; align-items: center; justify-content: center; color: #64748b; font-size: 14px; pointer-events: none; z-index: 10; }

    /* canvas */
    #live2d-wrapper > canvas { display: block; width: 100% !important; height: 100% !important; background: transparent; }
  </style>
  <script src="https://live2d.muqingxi.com/Core/live2dcubismcore.js"></script>
  <script type="module" crossorigin src="https://live2d.muqingxi.com/live2dplugin.js"></script>
</head>
<body>
<div id="model-area">
  <div id="live2d-wrapper">
    <div class="live2d-config"
         data-cubism-model="https://live2d.muqingxi.com/Elysia"
         data-model-path="https://img.bj0yx.com/"
         data-show-background="false"
         data-shader-path="https://live2d.muqingxi.com/Framework/Shaders/WebGL/"
         data-container="#live2d-wrapper">
    </div>
  </div>
  <div id="loading">等待模型加载...</div>
</div>

<div id="panel">
  <div id="panel-header">
    <h2>参数控制面板</h2>
    <div class="info" id="model-info">加载中...</div>
    <input type="text" id="search" placeholder="搜索参数 ID / 名称..." autocomplete="off">
  </div>
  <div id="panel-body"></div>
  <div id="panel-footer">
    <span class="stats" id="stats">-</span>
    <button id="btn-reset-all">全部重置</button>
    <button id="btn-refresh">刷新列表</button>
  </div>
</div>

<script>
  let allParams = [];
  let sliderTimers = {};

  // 等待 SDK 加载
  (function waitForSDK() {
    if (window.Live2DModel) {
      window.Live2DModel.onReady(onModelReady);
    } else {
      setTimeout(waitForSDK, 100);
    }
  })();

  function onModelReady() {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('model-info').textContent = '模型就绪 — Elysia';
    loadParams();
    startLiveUpdate();
  }

  function loadParams() {
    allParams = window.Live2DModel.listParameters(true);
    renderParams(allParams);
    document.getElementById('stats').textContent = `共 ${allParams.length} 个参数`;
  }

  function renderParams(params) {
    const body = document.getElementById('panel-body');
    body.innerHTML = '';
    for (const p of params) {
      const group = document.createElement('div');
      group.className = 'param-group';
      group.dataset.id = p.id;

      const row = document.createElement('div');
      row.className = 'param-row';
      row.onclick = () => {
        const detail = group.querySelector('.param-detail');
        detail.classList.toggle('show');
      };

      const name = document.createElement('div');
      name.className = 'param-name';
      name.textContent = p.id;
      name.title = p.id;

      const slider = document.createElement('input');
      slider.type = 'range';
      slider.className = 'param-slider';
      slider.min = p.min;
      slider.max = p.max;
      slider.step = (p.max - p.min) / 200;
      slider.value = p.current;
      slider.dataset.paramId = p.id;

      slider.oninput = () => {
        const v = parseFloat(slider.value);
        valueEl.textContent = v.toFixed(2);
        window.Live2DModel._setParamDirect(p.id, v);
      };

      const valueEl = document.createElement('div');
      valueEl.className = 'param-value';
      valueEl.textContent = p.current.toFixed(2);

      const range = document.createElement('div');
      range.className = 'param-range';
      range.textContent = `[${p.min}, ${p.max}]`;

      row.appendChild(name);
      row.appendChild(slider);
      row.appendChild(valueEl);
      row.appendChild(range);

      // 详情
      const detail = document.createElement('div');
      detail.className = 'param-detail';
      detail.innerHTML = `
          <div class="detail-row">索引: <span>${p.index}</span></div>
          <div class="detail-row">范围: <span>${p.min}</span> ~ <span>${p.max}</span></div>
          <div class="detail-row">默认: <span>${p.default.toFixed(3)}</span></div>
          <div class="detail-row">当前: <span class="detail-current">${p.current.toFixed(3)}</span></div>
        `;
      const resetBtn = document.createElement('button');
      resetBtn.className = 'reset-btn';
      resetBtn.textContent = '重置为默认值';
      resetBtn.onclick = (e) => {
        e.stopPropagation();
        slider.value = p.default;
        valueEl.textContent = p.default.toFixed(2);
        detail.querySelector('.detail-current').textContent = p.default.toFixed(3);
        window.Live2DModel._setParamDirect(p.id, p.default);
      };
      detail.appendChild(resetBtn);

      group.appendChild(row);
      group.appendChild(detail);
      body.appendChild(group);
    }
  }

  // 搜索
  document.getElementById('search').oninput = function() {
    const q = this.value.toLowerCase();
    if (!q) {
      renderParams(allParams);
      return;
    }
    const filtered = allParams.filter(p =>
            p.id.toLowerCase().includes(q)
    );
    renderParams(filtered);
  };

  // 全部重置
  document.getElementById('btn-reset-all').onclick = () => {
    for (const p of allParams) {
      window.Live2DModel._setParamDirect(p.id, p.default);
    }
    loadParams();
  };

  // 刷新
  document.getElementById('btn-refresh').onclick = loadParams;

  // 每秒更新滑块当前值（仅未拖动的）
  function startLiveUpdate() {
    setInterval(() => {
      const params = window.Live2DModel.listParameters(true);
      for (const p of params) {
        const slider = document.querySelector(`.param-slider[data-param-id="${p.id}"]`);
        if (slider && document.activeElement !== slider) {
          slider.value = p.current;
          const valueEl = slider.parentElement.querySelector('.param-value');
          if (valueEl) valueEl.textContent = p.current.toFixed(2);
          const detail = slider.closest('.param-group')?.querySelector('.detail-current');
          if (detail) detail.textContent = p.current.toFixed(3);
        }
      }
    }, 500);
  }
</script>
</body>
</html>
